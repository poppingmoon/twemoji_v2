name: twemoji_v2
description: Twemoji for Flutter based on Twemoji 14.1.2 - Supports SVG
version: 0.5.3
homepage: https://github.com/DynxstyGIT/twemoji_v2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  io: ^1.0.5
  path: ^1.9.1
  xml: ^6.6.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  assets:
    - assets/svg/
